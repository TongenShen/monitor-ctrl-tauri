[package]
name = "monitor-ctrl-tauri"
version = "1.0.0"
description = "DDC/CI 显示器控制工具"
authors = ["monitor_ctrl"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "monitor_ctrl_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
