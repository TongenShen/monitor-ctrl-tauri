<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MonitorCtrl 快捷面板</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      padding: 12px;
      min-width: 240px;
      /* 万一系统字体放大导致内容超高, 允许滚动而不是被裁掉 */
      overflow-y: auto;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
    }
    .section {
      margin-bottom: 12px;
    }
    .section:last-child {
      margin-bottom: 0;
    }
    .section-title {
      font-size: 12px;
      color: var(--fg-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .brightness-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brightness-row input[type=range] {
      flex: 1;
    }
    .brightness-value {
      width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 14px;
    }
    select {
      width: 100%;
      padding: 6px 8px;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--fg);
      font-size: 13px;
    }
    select option {
      background: var(--bg-raised);
      color: var(--fg);
    }
    .btn-off {
      width: 100%;
      padding: 8px;
      background: var(--bg-danger, #c0392b);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-off:hover {
      opacity: 0.9;
    }
    /* 次级按钮: 重新枚举显示器 */
    .btn-ghost {
      width: 100%;
      padding: 7px;
      background: transparent;
      color: var(--fg-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn-ghost:hover:not(:disabled) {
      background: var(--bg-raised);
      color: var(--fg);
      border-color: var(--fg-muted);
    }
    .btn-ghost:disabled {
      opacity: 0.55;
      cursor: default;
    }
    /* 加载失败/未检测到显示器时, 重新枚举是唯一能做的事, 用强调色 */
    .btn-ghost--accent {
      color: var(--accent);
      border-color: var(--accent);
    }
    .btn-ghost--accent:hover:not(:disabled) {
      background: var(--accent-dim);
      color: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    .loading {
      color: var(--fg-muted);
      font-size: 12px;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">加载中...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
